{% if platform.id in filehost_platform_ids %}
<ul class="tiktok-config-list">
  {% for c in filehost_by_platform.get(platform.id, []) %}
  <li class="tiktok-config-card tiktok-config-card--linked">
    <div class="tiktok-config-card__main">
      <div class="tiktok-config-card__head">
        <strong class="tiktok-config-card__title">{{ c.name }}</strong>
        <span class="badge badge-active">{{ t('servers.filehost_badge') }}</span>
      </div>
      <p class="tiktok-config-card__meta sub">{% if c.extra_mask %}{{ c.extra_mask }} · {% endif %}{{ c.api_key_mask }}</p>
    </div>
    <div class="tiktok-config-card__actions">
      <button type="button" class="btn btn-ghost btn-sm btn-equipo-warn js-filehost-disconnect" data-account-id="{{ c.id }}">
        {{ t('servers.disconnect') }}
      </button>
    </div>
  </li>
  {% endfor %}
</ul>
{% endif %}
