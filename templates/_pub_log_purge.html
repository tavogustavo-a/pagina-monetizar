{% if user_has_admin_privileges(user) %}
<div id="pub-log-confirm" class="equipo-modal" aria-hidden="true">
  <div class="equipo-modal__backdrop" data-close-log-purge="pub-log-confirm" tabindex="-1"></div>
  <div class="equipo-modal__panel server-modal__panel extractor-confirm__panel" role="dialog" aria-modal="true" aria-labelledby="pub-log-confirm-title">
    <div class="equipo-modal__accent" aria-hidden="true"></div>
    <div class="equipo-modal__head">
      <div><h2 id="pub-log-confirm-title">{{ t('log.purge_confirm_title') }}</h2></div>
      <button type="button" class="equipo-modal__close" data-close-log-purge="pub-log-confirm" aria-label="{{ t('servers.modal_close') }}">×</button>
    </div>
    <div class="server-modal__body">
      <p class="extractor-confirm__body" id="pub-log-confirm-body"></p>
      <div class="extractor-confirm__actions">
        <button type="button" class="btn btn-ghost" data-close-log-purge="pub-log-confirm">{{ t('log.purge_cancel') }}</button>
        <button type="button" class="btn extractor-confirm__delete btn-user-delete" id="pub-log-confirm-delete" aria-label="{{ t('log.purge_confirm_btn') }}" title="{{ t('log.purge_confirm_btn') }}">{% include '_icon_trash.html' %}</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/log-purge.js?v=1"></script>
<script>
  window.wireLogPurge({
    fromId: "pub-log-from",
    toId: "pub-log-to",
    btnId: "pub-log-delete",
    msgId: "pub-log-msg",
    modalId: "pub-log-confirm",
    bodyId: "pub-log-confirm-body",
    confirmId: "pub-log-confirm-delete",
    countUrl: "/admin/api/publicaciones/logs/count",
    deleteUrl: "/admin/api/publicaciones/logs",
    i18n: {
      needDates: {{ t('log.purge_need_dates') | tojson }},
      invalid: {{ t('log.purge_invalid') | tojson }},
      none: {{ t('log.purge_none') | tojson }},
      confirmBody: {{ t('log.purge_confirm_pub') | tojson }},
      network: {{ t('log.purge_network') | tojson }},
      ok: {{ t('log.purge_ok') | tojson }}
    }
  });
</script>
{% endif %}
