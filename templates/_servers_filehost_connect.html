{% if platform.id in filehost_platform_ids %}
{% set extra_kind = filehost_extra_fields.get(platform.id, '') %}
{% set settings_url = (filehost_settings_urls or {}).get(platform.id, '') %}
<form class="api-form js-filehost-inline-form" data-platform-id="{{ platform.id }}" data-platform-name="{{ platform.name }}" data-extra-kind="{{ extra_kind }}">
  <input type="hidden" name="id" value="" />
  <input type="hidden" name="platform_id" value="{{ platform.id }}" />
  <input type="hidden" name="link_name" class="js-filehost-link-name" value="" />
  <p class="sub filehost-hint">
    {{ t('servers.filehost_hint') }}
    {% if settings_url %}
    <a href="{{ settings_url }}" target="_blank" rel="noopener noreferrer">{{ settings_url }}</a>
    {% endif %}
  </p>
  <label class="field js-account-name-field" hidden>
    <span>{{ t('api.field.name') }}</span>
    <input type="text" name="name" autocomplete="off" />
  </label>
  <label class="field">
    <span>{{ t('servers.filehost_field_key') }}</span>
    <div class="password-input-wrap">
      <input type="password" name="api_key" class="js-api-secret" autocomplete="new-password" />
      {% include "_password_eye.html" %}
    </div>
  </label>
  <label class="field js-filehost-extra-wrap"{% if not extra_kind %} hidden{% endif %}>
    <span class="js-filehost-extra-label">{% if extra_kind == 'login' %}{{ t('servers.filehost_field_login') }}{% else %}{{ t('servers.filehost_field_email') }}{% endif %}</span>
    <input type="text" name="extra" autocomplete="off"{% if extra_kind %} required{% endif %} />
  </label>
  <p class="sub js-filehost-form-msg" hidden></p>
  <div class="api-form__actions">
    <button type="submit" class="btn btn-accent">{{ t('servers.filehost_save') }}</button>
    <button type="button" class="btn btn-ghost js-filehost-test-btn">⚡ {{ t('servers.filehost_test') }}</button>
  </div>
</form>
{% endif %}
