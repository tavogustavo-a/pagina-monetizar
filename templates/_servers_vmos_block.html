{% if platform.id in vmos_platform_ids %}
<ul class="tiktok-config-list">
  {% for c in vmos_by_platform.get(platform.id, []) %}
  <li
    class="tiktok-config-card tiktok-config-card--linked js-vmos-linked"
    data-account-id="{{ c.id }}"
    data-account-name="{{ c.name }}"
    data-payload="{{ {'id': c.id, 'access_key': c.access_key, 'secret_key': c.secret_key, 'pad_code': c.pad_code, 'template_id': c.template_id, 'remark': c.remark} | json_attr }}"
  >
    <div class="tiktok-config-card__main">
      <div class="tiktok-config-card__head">
        <span class="badge badge-active">{{ t('servers.connected') }}</span>
      </div>
      {% if c.name %}
      <p class="tiktok-config-card__meta sub">{{ c.name }}</p>
      {% endif %}
    </div>
    <div class="tiktok-config-card__actions">
      <button type="button" class="btn btn-ghost btn-sm btn-equipo-warn js-vmos-disconnect" data-account-id="{{ c.id }}">
        {{ t('servers.disconnect') }}
      </button>
    </div>
  </li>
  {% endfor %}
</ul>
{% endif %}
