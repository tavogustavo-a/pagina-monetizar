<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <meta name="description" content="{{ site_description }}" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css?v=panel204" />
    <meta name="service-worker-url" content="/sw.js" />
    <meta name="offline-banner-offline" content="{{ t('offline.banner') }}" />
    <meta name="offline-banner-online" content="{{ t('offline.restored') }}" />
  </head>
  <body>
    {% block body %}{% endblock %}
    <script src="/static/js/register_service_worker.js?v=1" defer></script>
    <script src="/static/js/offline-status.js?v=1" defer></script>
  </body>
</html>
