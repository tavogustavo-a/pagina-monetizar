<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <meta name="description" content="{{ site_description }}" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/style.css?v=panel332" />
    <meta name="service-worker-url" content="/sw.js" />
    <meta name="offline-banner-offline" content="{{ t('offline.banner') }}" />
    <meta name="offline-banner-online" content="{{ t('offline.restored') }}" />
  </head>
  <body>
    {% block body %}{% endblock %}
    {% block site_footer %}
    {% if not (user is defined and user and user_is_publisher_mode(user)) %}
    {% include "_footer.html" %}
    {% endif %}
    {% endblock %}
    <script src="/static/js/register_service_worker.js?v=1" defer></script>
    <script src="/static/js/offline-status.js?v=1" defer></script>
  </body>
</html>
