<!DOCTYPE html>
<html lang="{{ lang | default('es') }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}{{ t('offline.title') }}{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Tahoma, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        background:
          radial-gradient(900px 500px at 10% 0%, rgba(37, 244, 238, 0.12), transparent 55%),
          radial-gradient(700px 420px at 90% 100%, rgba(254, 44, 85, 0.1), transparent 50%),
          #000;
        color: #fff;
      }
      .err-card {
        width: 100%;
        max-width: 420px;
        border-radius: 1rem;
        padding: 1.75rem 1.5rem 1.5rem;
        text-align: center;
        border: 1px solid rgba(37, 244, 238, 0.35);
        background: linear-gradient(180deg, #1a1c2e 0%, #0a0a0a 100%);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }
      .err-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(37, 244, 238, 0.12);
        color: #25f4ee;
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1;
      }
      h1 {
        margin: 0 0 0.55rem;
        font-size: 1.35rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 0.75rem;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.98rem;
        line-height: 1.45;
      }
      .err-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        justify-content: center;
        margin-top: 1.15rem;
      }
      .err-btn {
        appearance: none;
        border: none;
        border-radius: 0.6rem;
        padding: 0.7rem 1.1rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        color: #000;
        background: linear-gradient(135deg, #25f4ee, #fe2c55);
      }
      .err-btn--soft {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .err-btn:hover { filter: brightness(1.06); }
      .err-retry-form {
        display: inline;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <main class="err-card" role="main">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/error_page.js?v=1" defer></script>
  </body>
</html>
